name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref.
# Saves CI minutes; the latest commit's run supersedes older ones.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-plugin:
    name: Windows plugin checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install pinned plugin runtime without lifecycle scripts
        run: npm ci --ignore-scripts --strict-peer-deps --prefix plugins/swsd/runtime

      - name: Audit pinned plugin runtime
        run: npm audit --audit-level=low --prefix plugins/swsd/runtime

      - name: Validate profile persistence without credential writes
        run: powershell.exe -NoProfile -NonInteractive -File tests/windows-plugin/check-profiles.ps1

      - name: Validate setup controls without opening a window
        run: powershell.exe -NoProfile -NonInteractive -STA -File plugins/swsd/scripts/Manage-Swsd.ps1 -ValidateUi

      - name: Check real launcher and all five STDIO profiles
        run: node tests/windows-plugin/check-stdio.mjs plugins/swsd/runtime/node_modules/swsd-mcp/dist

  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage gates
        run: npm run test:coverage

      - name: Build and verify legacy HTTP and STDIO clients
        run: npm run build && node scripts/smoke-protocols.mjs

  docs:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'

      - name: Install docs dependencies
        run: npm ci

      - name: Audit docs dependencies
        run: npm audit --audit-level=low

      - name: Build docs site
        run: npm run build

  docker:
    name: Build + smoke Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image (loaded into local Docker, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: swsd-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run --rm -d --name swsd-mcp-ci -p 3000:3000 \
            -e SWSD_TRANSPORT=http \
            -e SWSD_BASE_URL=https://api.samanage.com \
            swsd-mcp:ci

          # Wait up to 15s for /healthz to respond
          for i in $(seq 1 15); do
            if curl -sSf http://localhost:3000/healthz > /dev/null 2>&1; then
              echo "Container is healthy."
              break
            fi
            echo "Waiting for /healthz... ($i/15)"
            sleep 1
          done

          # Final verification — must contain "ok":true
          response=$(curl -sS http://localhost:3000/healthz)
          echo "Response: $response"
          echo "$response" | grep -q '"ok":true' || (echo "Healthz did not return ok=true" && exit 1)

          # Verify /mcp without auth returns 401
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","method":"tools/list","id":1}' \
            http://localhost:3000/mcp)
          echo "/mcp without auth status: $status"
          [ "$status" = "401" ] || (echo "Expected 401 for unauthenticated /mcp, got $status" && exit 1)

          docker stop swsd-mcp-ci

  publish:
    name: Publish image to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, docker]
    # Only publish from main branch pushes (not PRs).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Compute lowercase image name
        # ghcr.io requires lowercase image names; github.repository preserves case.
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
