<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWSD Change Calendar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="root">
      <header>
        <div class="heading">
          <h1 id="title">Change calendar</h1>
          <p id="window">Upcoming changes and releases</p>
        </div>
        <div id="chips" class="chips" aria-label="Calendar totals"></div>
      </header>
      <p id="notice" class="notice" role="status" hidden></p>
      <div id="days"></div>
      <p id="empty" class="empty">Loading calendar…</p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
