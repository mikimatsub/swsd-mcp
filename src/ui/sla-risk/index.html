<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SWSD SLA Risk</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="root">
      <header>
        <h1 id="title">SLA Risk</h1>
        <div id="chips" class="chips"></div>
      </header>
      <div class="table-scroll">
        <table id="table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Name</th>
              <th scope="col">Risk</th>
              <th scope="col">Due</th>
              <th scope="col">Priority</th>
              <th scope="col">Assignee</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No incidents match the current filters.</p>
    </main>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
